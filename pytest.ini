[pytest]
# Disable pytest-flask: its autouse _push_request_context fixture holds one
# app/request context (and one `g`) for the whole test, so test-client
# requests reuse Flask-Login's cached user instead of authenticating each
# request fresh. That silently breaks multi-user session-switching tests.
# No test uses any other pytest-flask feature (app/client come from
# tests/conftest.py), so the plugin is purely harmful here.
addopts = -p no:flask
