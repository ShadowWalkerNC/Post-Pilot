[build]
builder = "NIXPACKS"
nixpacksPlan = { providers = ["python", "node"], phases = { setup = { nixPkgs = ["python311", "nodejs_18"] }, install = { cmds = ["pip install -r requirements.txt", "npm i"] } } }

[deploy]
startCommand = "gunicorn app:app --bind 0.0.0.0:${PORT:-5000} --workers 2 --timeout 120"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

